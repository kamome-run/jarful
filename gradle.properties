# Gradle 9.3 writes Java @argfiles with its default charset; the Windows
# launcher reads them with the native charset (Gradle issue #30304).
# COMPAT keeps those encodings aligned for Japanese workspace paths.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=COMPAT
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g
android.useAndroidX=true
android.nonTransitiveRClass=true
# This Windows workspace is under a Japanese user profile. Allow Unicode paths;
# actual compiler/packager failures still stop the build and remain visible.
android.overridePathCheck=true
