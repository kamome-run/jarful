name: Git-flow

on:
  pull_request_target:
    branches: [main, develop, 'release/**']
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  policy:
    name: Git-flow policy
    runs-on: ubuntu-latest
    steps:
      # Run only trusted base code. Never check out or execute the PR head here.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --test tools/check-git-flow.test.mjs
      - run: node tools/check-git-flow.mjs
